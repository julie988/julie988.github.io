      <!-- december -->
      <figure class="gallery-piece">
        <div class="gallery-piece__frame">
          <img src="assets/paintings/december.jpg" alt="December" width="2000" height="3090" loading="lazy" decoding="async">

        <figcaption class="gallery-piece__caption">
          <strong>December Krampus calendar</strong>

        </div>
        <figcaption class="gallery-piece__caption">
          <strong>Goatman</strong>
          <span class="gallery-piece__meta">Traditional animation, 2026</span>
          <p class="gallery-piece__desc">About transformation and discovery.</p>
        </figcaption>
